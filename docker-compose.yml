# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# Stack completo: Airflow 2.9 (LocalExecutor) + Postgres metadata
#
# Arquitectura:
#   - airflow-init      : Inicializa la DB de Airflow y crea el usuario admin
#   - airflow-scheduler : Ejecuta los schedulers / trigger de DAGs
#   - airflow-webserver : UI en http://localhost:8080
#   - postgres-airflow  : PostgreSQL solo para los metadatos de Airflow
#
# El repositorio del proyecto se monta en /opt/airflow/repo (lectura/escritura).
# Las credenciales del .env del proyecto se inyectan como env vars en todos
# los servicios de Airflow.
#
# Uso:
#   docker compose up -d          # Arrancar el stack
#   docker compose down           # Parar y eliminar contenedores
#   docker compose logs -f        # Ver logs en tiempo real
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: tfm-airflow:latest
  env_file:
    - airflow.env
  environment:
    # Credenciales del proyecto (las mismas que en .env del repo)
    - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
    - AZURE_DB_USER=${AZURE_DB_USER}
    - AZURE_DB_PASSWORD=${AZURE_DB_PASSWORD}
    - AZURE_DB_HOST=${AZURE_DB_HOST}
    - AZURE_DB_NAME=${AZURE_DB_NAME}
    - AZURE_DB_URL=${AZURE_DB_URL}
    - DB_USER=${DB_USER:-${AZURE_DB_USER:-}}
    - DB_PASSWORD=${DB_PASSWORD:-${AZURE_DB_PASSWORD:-}}
    - DB_HOST=${DB_HOST:-${AZURE_DB_HOST:-}}
    - DB_NAME=${DB_NAME:-${AZURE_DB_NAME:-}}
    - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    - TRIPADVISOR_KEY=${TRIPADVISOR_KEY}
    - GEE_PROJECT_ID=${GEE_PROJECT_ID}
    - EARTHDATA_TOKEN=${EARTHDATA_TOKEN}
    - ORS_API_KEY=${ORS_API_KEY}
  volumes:
    # DAGs del proyecto
    - ./dags:/opt/airflow/dags:ro
    # Repositorio completo (ingestion, analytics, dbt_project, data)
    - .:/opt/airflow/repo
    # Logs de Airflow (fuera del repo para no ensuciar git)
    - airflow-logs:/opt/airflow/logs
    # Caché de Google Earth Engine (autenticación persistente)
    - gee-credentials:/root/.config/earthengine
  depends_on:
    postgres-airflow:
      condition: service_healthy
  restart: unless-stopped

services:

  # ── Postgres para metadatos de Airflow ──────────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: tfm-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      # Exponer en un puerto distinto al 5432 del proyecto para evitar conflictos
      - "5433:5432"

  # ── Inicialización (se ejecuta una vez y termina) ───────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: tfm-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname TFM \
          --lastname Tenerife \
          --role Admin \
          --email admin@tfm.local \
          --password admin
        echo "Airflow inicializado correctamente."
    restart: "no"

  # ── Scheduler ───────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: tfm-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Webserver (UI) ──────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: tfm-airflow-webserver
    command: webserver
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-airflow-data:
  airflow-logs:
  gee-credentials:
