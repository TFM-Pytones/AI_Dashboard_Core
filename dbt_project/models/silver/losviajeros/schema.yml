version: 2

models:
  - name: silver_losviajeros_mensajes
    description: "Mensajes y opiniones individuales de los foros de LosViajeros.com, preparados para análisis de procesamiento de lenguaje natural (NLP)."
    columns:
      - name: mensaje_id
        description: "Identificador unívoco del mensaje en el foro."
        tests:
          - unique
          - not_null
      - name: tema_id
        description: "Identificador del tema al que pertenece el mensaje."
        tests:
          - not_null
      - name: texto
        description: "Contenido textual del mensaje publicado."
        tests:
          - not_null
      - name: fecha_mensaje
        description: "Fecha de publicación del mensaje en el foro."
        tests:
          - not_null
