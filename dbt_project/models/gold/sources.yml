version: 2
sources:
  - name: gold_nlp
    schema: gold
    description: >
      Tablas de la capa Gold escritas directamente por los notebooks de NLP
      (Tarea 2.1 sentimiento, Tarea 2.2 aspectos) via pandas.to_sql, fuera del
      control de dbt. Se declaran como source para poder referenciarlas desde
      modelos dbt sin hardcodear nombres de esquema/tabla.
    tables:
      - name: nlp_sentimiento_resenas
        description: "Score de sentimiento (1-5) por reseña, con h3_index ya resuelto (analytics/tarea2/nlp_sentimiento_2_1.ipynb)."
      - name: nlp_aspectos_resenas
        description: "Aspectos extraidos por reseña via PyABSA, en el idioma original (analytics/tarea2/nlp_aspectos_tarea_2_2.ipynb)."
      - name: aspecto_traducciones
        description: "Mapeo aspecto_original -> aspecto_traducido/normalizado (analytics/tarea2/traducir_aspectos.ipynb)."
      - name: nlp_topics
        description: "Topico de BERTopic por opinion, Modelos A y B (analytics/topics/import_geo_results.py). Sin h3_index: la georreferenciacion vive en nlp_chunks."
      - name: nlp_chunks
        description: "Corpus fragmentado y enriquecido con municipio/zona/h3_index/fecha para el RAG (analytics/rag/build_chunks.py, ver plan_rag.md)."
      - name: geo_mentions
        description: "Lugar detectado en cada mensaje de LosViajeros por coincidencia con gazetteer (analytics/geo/extract_toponyms.py). Da nombre de lugar, no coordenadas."
