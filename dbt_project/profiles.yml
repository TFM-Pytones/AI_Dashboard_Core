tenerife_tourism_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DBNAME') }}"
      schema: processed_data
      port: 5432
      threads: 4
      sslmode: require