# Fase 5 del RAG (ver plan_rag.md) -- Conjunto de oro para evaluar el sistema.
#
# Tres tipos de pregunta, cada uno mide algo distinto:
#
#   normal      Debe responder citando fragmentos relevantes. Se comprueba que
#               los filtros deducidos son los correctos y que entre los
#               fragmentos recuperados aparece al menos uno de los terminos
#               esperados (en cualquier idioma: el corpus es multilingue).
#
#   abstencion  La respuesta NO esta en el corpus. Debe decir que no hay
#               informacion suficiente, no inventarsela. Es la prueba de que el
#               sistema esta anclado en los datos.
#
#   agregacion  Preguntas de conteo o totales. El RAG solo ve k fragmentos de
#               87.981, asi que NO puede responderlas: debe abstenerse o
#               responder en terminos cualitativos. Estas preguntas justifican
#               empiricamente la decision de arquitectura de dos herramientas
#               (RAG + Text-to-SQL) de la seccion 2 de plan_rag.md.
#
# terminos_esperados se cumple con que aparezca UNO cualquiera, no todos.

- id: ruido_arona
  pregunta: "¿qué opinan del ruido por la noche en Arona?"
  tipo: normal
  filtros_esperados:
    municipio: Arona
  terminos_esperados: [ruido, noise, rumor, laut, lawaai, noches]

